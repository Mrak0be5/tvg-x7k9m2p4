<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiger Video Gallery</title>
  <style>
    :root {
      --bg: #0d0f14;
      --panel: #161a22;
      --panel2: #1c2230;
      --text: #e8ecf4;
      --muted: #8b93a7;
      --accent: #f0a500;
      --accent2: #ff6b4a;
      --border: #2a3142;
      --ok: #3dd68c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2030 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(13, 15, 20, 0.85);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    header h1 span { color: var(--accent); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    input[type="search"], select {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.9rem;
      min-width: 180px;
    }
    input[type="search"]:focus, select:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent);
      border-color: var(--accent);
    }
    .badge {
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      min-height: calc(100vh - 64px);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    }
    .sidebar {
      border-right: 1px solid var(--border);
      background: rgba(22, 26, 34, 0.7);
      overflow: auto;
      padding: 12px;
    }
    .vid-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      margin-bottom: 6px;
      transition: background 0.15s, border-color 0.15s;
    }
    .vid-item:hover { background: var(--panel2); border-color: var(--border); }
    .vid-item.active {
      background: linear-gradient(135deg, rgba(240,165,0,0.12), rgba(255,107,74,0.08));
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    }
    .vid-item .name {
      font-size: 0.86rem;
      word-break: break-all;
      line-height: 1.35;
    }
    .vid-item .meta {
      grid-column: 1 / -1;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .tag {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 7px;
      border-radius: 6px;
      height: fit-content;
      white-space: nowrap;
    }
    .tag.s25 { background: rgba(61,214,140,0.15); color: var(--ok); }
    .tag.s20 { background: rgba(240,165,0,0.15); color: var(--accent); }
    .tag.wan { background: rgba(120,160,255,0.15); color: #8ab4ff; }
    .tag.other { background: rgba(139,147,167,0.15); color: var(--muted); }
    .main {
      padding: 18px 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .player-wrap {
      background: #000;
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      aspect-ratio: 16 / 9;
      max-height: min(70vh, 720px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: min(70vh, 720px);
      background: #000;
      outline: none;
    }
    .info {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .info h2 {
      margin: 0 0 6px;
      font-size: 1rem;
      word-break: break-all;
    }
    .info p {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    button, .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.86rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover, .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    button.primary, .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: #1a1200;
      font-weight: 650;
    }
    button.primary:hover, .btn.primary:hover { filter: brightness(1.05); color: #1a1200; }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 16px;
    }
    .hint {
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Tiger <span>Video</span> Gallery</h1>
    <div class="controls">
      <a class="btn" href="storyboards/mars-harvester-9frames/">🖼 Раскадровка</a>
      <input type="search" id="search" placeholder="Поиск по имени…" autocomplete="off" />
      <select id="filter">
        <option value="all">Все модели</option>
        <option value="s25">Seedance 2.5</option>
        <option value="s20">Seedance 2.0</option>
        <option value="wan">Wan</option>
        <option value="other">Other</option>
      </select>
      <select id="sort">
        <option value="newest">Сначала новые</option>
        <option value="oldest">Сначала старые</option>
        <option value="name">По имени</option>
        <option value="size">По размеру</option>
      </select>
      <span class="badge" id="count">0</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="list"></aside>
    <main class="main">
      <div class="player-wrap">
        <video id="player" controls playsinline preload="metadata">
          Ваш браузер не поддерживает video.
        </video>
      </div>
      <div class="info">
        <h2 id="title">Выбери видео слева</h2>
        <p id="meta">Локальный просмотр HTML5 · без сервера · file:// или Live Server</p>
        <div class="actions">
          <button class="primary" id="btnPlay" type="button">▶ Play / Pause</button>
          <button id="btnReplay" type="button">↺ Сначала</button>
          <button id="btnMute" type="button">🔊 Mute</button>
          <a class="btn" id="btnOpen" href="#" target="_blank" rel="noopener">↗ Открыть файл</a>
          <a class="btn primary" id="btnDownload" href="#" download aria-label="Скачать выбранное видео">⬇ Скачать MP4</a>
        </div>
        <p class="hint" style="margin-top:10px">
          Горячие клавиши: <kbd>Space</kbd> play/pause · <kbd>←</kbd>/<kbd>→</kbd> ±5с · <kbd>M</kbd> mute · <kbd>F</kbd> fullscreen
        </p>
      </div>
    </main>
  </div>

  <script>
    // Embedded catalog (regenerated with page). Paths relative to this HTML.
    const VIDEOS = [
      {"name":"mars-harvester-rear-focus-hook7-plus-speedgame23-final30s.mp4","sizeMB":26.45,"mtime":"2026-09-05 05:12","family":"s20","note":"Mars Harvester · новый Seedance-хук 7с + весь геймплей, ускоренный до 23с · финал 30с · NEW"},
      {"name":"mars-harvester-seedance20-fast-rear-focus-hook-7s.mp4","sizeMB":2.24,"mtime":"2026-09-05 05:11","family":"s20","note":"Mars Harvester · Seedance 2.0 Fast 480p · инженерка ремонтирует с низкого задне-бокового ракурса · отдельный хук 7с · NEW"},
      {"name":"mars-harvester-seedance20-fast-hook-plus-gameplay-29s.mp4","sizeMB":24.98,"mtime":"2026-09-05 04:59","family":"s20","note":"Mars Harvester · Seedance 2.0 Fast 480p нейрохук 6с + оригинальный геймплей 23с · финал 29с · NEW"},
      {"name":"mars-harvester-seedance20-fast-480p-3refs-6s.mp4","sizeMB":2.09,"mtime":"2026-09-05 04:50","family":"s20","note":"Mars Harvester · настоящий Seedance 2.0 Fast · 480p · 3 референса · непрерывный прерол 6с · NEW"},
      {"name":"mars-harvester-seedance20-plus-gameplay-35s.mp4","sizeMB":18.48,"mtime":"2026-09-05 04:31","family":"s20","note":"Mars Harvester · настоящий Seedance 2.0 Fast · нейрохук 6с + полный геймплей · 35с · NEW"},
      {"name":"mars-harvester-seedance20-preroll-6s.mp4","sizeMB":6.05,"mtime":"2026-09-05 04:31","family":"s20","note":"Mars Harvester · настоящий Seedance 2.0 Fast · отдельный непрерывный прерол 6с · верхняя крышка · match-cut"},
      {"name":"mars-harvester-engineer-hook-plus-gameplay-29s.mp4","sizeMB":24.86,"mtime":"2026-09-04 04:39","family":"s20","note":"Mars Harvester · инженерный нейрохук 6с + геймплей · 29с"},
      {"name":"tiger_crowd_blogger_dilator_7s_seedance25_480p_v2.mp4","sizeMB":3.34,"mtime":"2026-08-09 23:13","note":"Seedance 2.5 · crowd blogger dilator 7s 480p · v2 NEW"},
      {"name":"tiger_crowd_blogger_dilator_7s_seedance25_480p.mp4","sizeMB":2.43,"mtime":"2026-08-09 22:22","note":"Seedance 2.5 · crowd blogger dilator 7s 480p · v1"},
      {"name":"tiger_crowd_blogger_dilator_7s_480p.mp4","sizeMB":1.74,"mtime":"2026-08-09 16:49","note":"Seedance 2.0 (не 2.5) · crowd blogger"},
      {"name":"tiger_crowd_handstand_topdown_dilator_6s.mp4","sizeMB":3.17,"mtime":"2026-08-09 12:36"},
      {"name":"tiger_crowd_dilator_6s.mp4","sizeMB":3.43,"mtime":"2026-08-08 22:40"},
      {"name":"tiger_table_hard_dry_17s.mp4","sizeMB":9.62,"mtime":"2026-08-08 20:17"},
      {"name":"tiger_table_bbc_switch_17s.mp4","sizeMB":8.82,"mtime":"2026-08-08 20:06"},
      {"name":"tiger_table_orbit_anal_pullout_10s.mp4","sizeMB":5.83,"mtime":"2026-08-08 19:43"},
      {"name":"tiger_table_lookcam_wince_pullout_10s.mp4","sizeMB":2.96,"mtime":"2026-08-08 19:33"},
      {"name":"tiger_table_coffee_pullout_face_seedance25_ff_10s.mp4","sizeMB":5.74,"mtime":"2026-08-08 19:19"},
      {"name":"tiger_table_coffee_orbit_seedance25_ff_8s.mp4","sizeMB":4.37,"mtime":"2026-08-08 19:00"},
      {"name":"tiger_table_3strokes_seedance20_ff_5s.mp4","sizeMB":1.29,"mtime":"2026-08-08 18:47"},
      {"name":"tiger_table_3strokes_seedance25_ff_5s.mp4","sizeMB":1.98,"mtime":"2026-08-08 18:28"},
      {"name":"tiger_barbell_anal_3strokes_OLDPROMPT_seedance25_ff_5s.mp4","sizeMB":3.24,"mtime":"2026-08-08 18:13"},
      {"name":"tiger_barbell_anal_ballsdeep_only_seedance25_ff_5s.mp4","sizeMB":3.1,"mtime":"2026-08-08 18:03"},
      {"name":"tiger_barbell_anal_3strokes_seedance25_ff_5s.mp4","sizeMB":1.43,"mtime":"2026-08-08 17:52"},
      {"name":"tiger_anal_3strokes_seedance25_ff_5s.mp4","sizeMB":2.23,"mtime":"2026-08-08 17:18"},
      {"name":"tiger_deep_anal_hilt_seedance25_ff_5s.mp4","sizeMB":2.4,"mtime":"2026-08-08 17:10"},
      {"name":"tiger_deep_anal_pleased_seedance25_firstframe_5s.mp4","sizeMB":3.16,"mtime":"2026-08-08 17:03"},
      {"name":"tiger_deep_anal_pleased_seedance25_5s.mp4","sizeMB":1.75,"mtime":"2026-08-08 16:47"},
      {"name":"tiger_gym_anal_seedance25_ref_5s.mp4","sizeMB":2.64,"mtime":"2026-08-08 16:36"},
      {"name":"tiger_turn_allfours_seedance25_ref_480p.mp4","sizeMB":2.51,"mtime":"2026-08-08 16:09"},
      {"name":"tiger_turn_allfours_seedance25_480p.mp4","sizeMB":2.54,"mtime":"2026-08-08 14:17"},
      {"name":"tiger_dance_seedance25_kie.mp4","sizeMB":6.31,"mtime":"2026-08-08 14:09"},
      {"name":"seedance25_smoke_5s.mp4","sizeMB":2.43,"mtime":"2026-08-08 13:02"},
      {"name":"tiger_dance_wan26.mp4","sizeMB":2.87,"mtime":"2026-08-08 05:20"},
      {"name":"tiger_dance_wan27_5s.mp4","sizeMB":3.01,"mtime":"2026-08-08 05:20"}
    ].map(v => ({
      ...v,
      src: "videos/" + v.name,
      family: v.family || classify(v.name)
    }));

    function classify(name) {
      const n = name.toLowerCase();
      if (n.includes("seedance25") || n.includes("seedance_25") || n.includes("seedance-2-5") || n.includes("seedance25")) return "s25";
      // filenames like tiger_..._seedance25_...
      if (/seedance\s*2\.5|s25|2_5/.test(n)) return "s25";
      if (n.includes("seedance20") || n.includes("seedance_20") || n.includes("seedance-2-0")) return "s20";
      // blogger 7s without seedance25 in name was 2.0
      if (n.includes("wan")) return "wan";
      if (n.includes("seedance")) return "s25"; // most session files are 2.5
      return "other";
    }

    // Fix: explicit 2.0 file
    VIDEOS.forEach(v => {
      if (v.name.includes("seedance20")) v.family = "s20";
      if (v.name === "tiger_crowd_blogger_dilator_7s_480p.mp4") v.family = "s20";
      if (v.name.includes("seedance25") || v.name.includes("seedance25")) v.family = "s25";
      if (v.name.includes("wan")) v.family = "wan";
    });

    const listEl = document.getElementById("list");
    const player = document.getElementById("player");
    const titleEl = document.getElementById("title");
    const metaEl = document.getElementById("meta");
    const countEl = document.getElementById("count");
    const searchEl = document.getElementById("search");
    const filterEl = document.getElementById("filter");
    const sortEl = document.getElementById("sort");
    const btnOpen = document.getElementById("btnOpen");
    const btnDownload = document.getElementById("btnDownload");

    let current = null;
    let filtered = [];

    function tagLabel(f) {
      if (f === "s25") return { cls: "s25", text: "2.5" };
      if (f === "s20") return { cls: "s20", text: "2.0" };
      if (f === "wan") return { cls: "wan", text: "Wan" };
      return { cls: "other", text: "?" };
    }

    function getFiltered() {
      const q = searchEl.value.trim().toLowerCase();
      const f = filterEl.value;
      let items = VIDEOS.filter(v => {
        if (f !== "all" && v.family !== f) return false;
        if (q && !v.name.toLowerCase().includes(q) && !(v.note || "").toLowerCase().includes(q)) return false;
        return true;
      });
      const s = sortEl.value;
      items = items.slice().sort((a, b) => {
        if (s === "name") return a.name.localeCompare(b.name);
        if (s === "size") return (b.sizeMB || 0) - (a.sizeMB || 0);
        if (s === "oldest") return (a.mtime || "").localeCompare(b.mtime || "");
        return (b.mtime || "").localeCompare(a.mtime || ""); // newest
      });
      return items;
    }

    function renderList() {
      filtered = getFiltered();
      countEl.textContent = filtered.length + " / " + VIDEOS.length;
      if (!filtered.length) {
        listEl.innerHTML = '<div class="empty">Ничего не найдено</div>';
        return;
      }
      listEl.innerHTML = filtered.map((v, i) => {
        const t = tagLabel(v.family);
        const active = current && current.name === v.name ? "active" : "";
        return `<div class="vid-item ${active}" data-idx="${i}" role="button" tabindex="0">
          <div class="name">${escapeHtml(v.name)}</div>
          <span class="tag ${t.cls}">${t.text}</span>
          <div class="meta">${v.mtime || "—"} · ${v.sizeMB || "?"} MB${v.note ? " · " + escapeHtml(v.note) : ""}</div>
        </div>`;
      }).join("");
      listEl.querySelectorAll(".vid-item").forEach(el => {
        el.addEventListener("click", () => playItem(filtered[+el.dataset.idx]));
        el.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            playItem(filtered[+el.dataset.idx]);
          }
        });
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    function playItem(v, autoplay = true) {
      if (!v) return;
      current = v;
      player.src = v.src;
      titleEl.textContent = v.name;
      metaEl.textContent = `${v.mtime || "—"} · ${v.sizeMB || "?"} MB · ${v.family.toUpperCase()}${v.note ? " · " + v.note : ""}`;
      btnOpen.href = v.src;
      btnDownload.href = v.src;
      btnDownload.setAttribute("download", v.name);
      renderList();
      if (autoplay) {
        player.play().catch(() => {});
      }
      // scroll active into view
      const active = listEl.querySelector(".vid-item.active");
      if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    document.getElementById("btnPlay").addEventListener("click", () => {
      if (player.paused) player.play(); else player.pause();
    });
    document.getElementById("btnReplay").addEventListener("click", () => {
      player.currentTime = 0;
      player.play();
    });
    document.getElementById("btnMute").addEventListener("click", () => {
      player.muted = !player.muted;
      document.getElementById("btnMute").textContent = player.muted ? "🔇 Unmute" : "🔊 Mute";
    });

    searchEl.addEventListener("input", renderList);
    filterEl.addEventListener("change", renderList);
    sortEl.addEventListener("change", renderList);

    document.addEventListener("keydown", e => {
      if (e.target.matches("input, textarea, select")) return;
      if (e.code === "Space") {
        e.preventDefault();
        if (player.paused) player.play(); else player.pause();
      } else if (e.key === "ArrowRight") {
        player.currentTime = Math.min(player.duration || 0, player.currentTime + 5);
      } else if (e.key === "ArrowLeft") {
        player.currentTime = Math.max(0, player.currentTime - 5);
      } else if (e.key === "m" || e.key === "M") {
        player.muted = !player.muted;
        document.getElementById("btnMute").textContent = player.muted ? "🔇 Unmute" : "🔊 Mute";
      } else if (e.key === "f" || e.key === "F") {
        if (document.fullscreenElement) document.exitFullscreen();
        else player.requestFullscreen?.();
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        const i = filtered.findIndex(x => current && x.name === current.name);
        playItem(filtered[Math.min(filtered.length - 1, i + 1)] || filtered[0]);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const i = filtered.findIndex(x => current && x.name === current.name);
        playItem(filtered[Math.max(0, i - 1)] || filtered[0]);
      }
    });

    // Boot: open the newest gallery item so its download action is immediately available.
    renderList();
    const preferred = getFiltered()[0] || VIDEOS[0];
    if (preferred) playItem(preferred, false);
  </script>
</body>
</html>
